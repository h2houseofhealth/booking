name: Deploy DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  deploy:
    concurrency:
      group: deploy-dev
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Validate deploy config
        run: |
          if [ -z "${{ vars.PAGES_DEV_REPO }}" ]; then
            echo "Missing repo variable: PAGES_DEV_REPO"
            exit 1
          fi
          if [ -z "${{ secrets.GH_PAGES_PAT }}" ]; then
            echo "Missing secret: GH_PAGES_PAT"
            exit 1
          fi
          echo "Deploy target repo: ${{ vars.PAGES_DEV_REPO }}"

      - name: Normalize target repo value
        id: normalize_repo
        run: |
          RAW='${{ vars.PAGES_DEV_REPO }}'
          CLEAN=$(echo "$RAW" | tr -d '[:space:]')
          CLEAN=${CLEAN#https://github.com/}
          CLEAN=${CLEAN%.git}
          echo "repo=$CLEAN" >> "$GITHUB_OUTPUT"

      # ✅ FIXED BUILD (no recursion)
      - name: Build deploy artifact
        run: |
          mkdir dist
          rsync -av --exclude='.git' --exclude='.github' ./ dist/

      - name: Copy CNAME if exists
        if: ${{ hashFiles('CNAME') != '' }}
        run: cp CNAME dist/CNAME

      - name: Create CNAME from variable
        if: ${{ vars.PAGES_DEV_DOMAIN != '' }}
        run: echo "${{ vars.PAGES_DEV_DOMAIN }}" > dist/CNAME

      # ✅ FIXED DEPLOY
      - name: Push to booking-dev (gh-pages)
        env:
          GH_PAGES_PAT: ${{ secrets.GH_PAGES_PAT }}
        run: |
          set -e

          TARGET_REPO='${{ steps.normalize_repo.outputs.repo }}'
          WORK_DIR=$(mktemp -d)

          REMOTE_URL="https://x-access-token:${GH_PAGES_PAT}@github.com/${TARGET_REPO}.git"

          echo "Cloning..."
          git clone "$REMOTE_URL" "$WORK_DIR"
          cd "$WORK_DIR"

          # ✅ FIXED BRANCH HANDLING
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git checkout gh-pages
          else
            git checkout -b gh-pages
          fi

          # clean old files
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          # copy new files
          cp -R "$GITHUB_WORKSPACE/dist/." .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Deploy DEV from ${GITHUB_REPOSITORY}@${GITHUB_SHA}" || echo "No changes"

          git push origin gh-pages --force
