name: Deploy DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  deploy:
    concurrency:
      group: deploy-dev
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Validate deploy config
        run: |
          if [ -z "${{ vars.PAGES_DEV_REPO }}" ]; then
            echo "Missing repo variable: PAGES_DEV_REPO (expected format: owner/booking-dev)"
            exit 1
          fi
          if [ -z "${{ secrets.GH_PAGES_PAT }}" ]; then
            echo "Missing secret: GH_PAGES_PAT"
            exit 1
          fi
          echo "Deploy target repo: ${{ vars.PAGES_DEV_REPO }}"

      - name: Normalize target repo value
        id: normalize_repo
        run: |
          set -euo pipefail
          RAW='${{ vars.PAGES_DEV_REPO }}'
          CLEAN="$(printf '%s' "$RAW" | tr -d '[:space:]')"
          CLEAN="${CLEAN#git@github.com:}"
          CLEAN="${CLEAN#https://github.com/}"
          CLEAN="${CLEAN%.git}"
          CLEAN="${CLEAN%/}"
          echo "repo=$CLEAN" >> "$GITHUB_OUTPUT"

      # ✅ FIXED PART (IMPORTANT)
      - name: Build deploy artifact from repo files
        run: |
          mkdir -p ./dist
          rsync -av --exclude='.git' --exclude='.github' ./ ./dist/

      - name: Copy CNAME from repo root (optional)
        if: ${{ hashFiles('CNAME') != '' }}
        run: cp ./CNAME ./dist/CNAME

      - name: Create CNAME from variable (optional override)
        if: ${{ vars.PAGES_DEV_DOMAIN != '' }}
        run: echo "${{ vars.PAGES_DEV_DOMAIN }}" > ./dist/CNAME

      - name: Push dist to target gh-pages
        env:
          GH_PAGES_PAT: ${{ secrets.GH_PAGES_PAT }}
        run: |
          set -euo pipefail
          TARGET_REPO='${{ steps.normalize_repo.outputs.repo }}'
          WORK_DIR="$(mktemp -d)"
          REMOTE_URL="https://github.com/${TARGET_REPO}.git"

          git clone "${REMOTE_URL}" "$WORK_DIR"
          cd "$WORK_DIR"

          git switch --orphan gh-pages || git switch gh-pages

          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/dist/." .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Deploy DEV from ${GITHUB_REPOSITORY}@${GITHUB_SHA}" || echo "No changes"

          git push origin gh-pages --force
