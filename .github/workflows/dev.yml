name: Deploy DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  deploy:
    concurrency:
      group: deploy-dev
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Validate deploy config
        run: |
          if [ -z "${{ vars.PAGES_DEV_REPO }}" ]; then
            echo "Missing repo variable: PAGES_DEV_REPO (expected format: owner/booking-dev)"
            exit 1
          fi
          if [ -z "${{ secrets.GH_PAGES_PAT }}" ]; then
            echo "Missing secret: GH_PAGES_PAT"
            exit 1
          fi
          echo "Deploy target repo: ${{ vars.PAGES_DEV_REPO }}"

      - name: Normalize target repo value
        id: normalize_repo
        run: |
          set -euo pipefail
          RAW='${{ vars.PAGES_DEV_REPO }}'
          CLEAN="$(printf '%s' "$RAW" | tr -d '[:space:]')"
          CLEAN="${CLEAN#git@github.com:}"
          CLEAN="${CLEAN#ssh://git@github.com/}"
          CLEAN="${CLEAN#https://github.com/}"
          CLEAN="${CLEAN#http://github.com/}"
          CLEAN="${CLEAN#git://github.com/}"
          CLEAN="${CLEAN#github.com:}"
          CLEAN="${CLEAN#github.com/}"
          CLEAN="${CLEAN%.git}"
          CLEAN="${CLEAN%/}"

          while [[ "$CLEAN" == /* || "$CLEAN" == :* ]]; do
            CLEAN="${CLEAN#/}"
            CLEAN="${CLEAN#:}"
          done

          echo "Clean repo = $CLEAN"

          if [[ ! "$CLEAN" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid repo format"
            exit 1
          fi

          echo "repo=$CLEAN" >> "$GITHUB_OUTPUT"

      # ✅ BUILD FULL PROJECT (not just index.html)
      - name: Build deploy artifact
        run: |
          mkdir -p dist
          cp -R . dist
          rm -rf dist/.git
          rm -rf dist/.github

      # OPTIONAL CNAME SUPPORT
      - name: Copy CNAME if exists
        if: ${{ hashFiles('CNAME') != '' }}
        run: cp CNAME dist/CNAME

      - name: Create CNAME from variable
        if: ${{ vars.PAGES_DEV_DOMAIN != '' }}
        run: echo "${{ vars.PAGES_DEV_DOMAIN }}" > dist/CNAME

      # ✅ DEPLOY WITH TOKEN (FIXED)
      - name: Push to booking-dev (gh-pages)
        env:
          GH_PAGES_PAT: ${{ secrets.GH_PAGES_PAT }}
        run: |
          set -euo pipefail

          TARGET_REPO='${{ steps.normalize_repo.outputs.repo }}'
          WORK_DIR=$(mktemp -d)

          REMOTE_URL="https://x-access-token:${GH_PAGES_PAT}@github.com/${TARGET_REPO}.git"

          echo "Cloning repo..."
          git clone "$REMOTE_URL" "$WORK_DIR"
          cd "$WORK_DIR"

          # switch/create gh-pages branch
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git switch gh-pages
          else
            git switch --orphan gh-pages
          fi

          # clean old files
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          # copy new build
          cp -R "$GITHUB_WORKSPACE/dist/." .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          git commit -m "Deploy DEV from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"

          git push origin gh-pages --force
